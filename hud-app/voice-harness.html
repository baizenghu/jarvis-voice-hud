<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>语音回路 harness</title>
  <style>
    body { font: 16px system-ui; max-width: 640px; margin: 40px auto; }
    button { font-size: 18px; padding: 10px 20px; }
    #log { white-space: pre-wrap; background: #111; color: #0f0; padding: 12px;
           margin-top: 16px; border-radius: 8px; min-height: 200px; }
  </style>
</head>
<body>
  <h1>贾维斯语音回路 · Phase 0 harness</h1>
  <p>WS: <code id="wsurl"></code></p>
  <button id="echo">按住说话 · echo(转写→念回,不需 LLM)</button>
  <button id="rec">按住说话 · 问 hermes(需配置模型)</button>
  <div id="log"></div>

<script>
// Follow the page scheme: an https page must use wss:// (a ws:// from https is
// blocked as mixed content). Served over http://localhost → ws://.
const WS_PROTO = location.protocol === "https:" ? "wss" : "ws";
const WS_URL = `${WS_PROTO}://${location.host || "localhost:8765"}/api/ws`;
document.getElementById("wsurl").textContent = WS_URL;
const log = (m) => { document.getElementById("log").textContent += m + "\n"; };

let ws, sessionId = null, ridSeq = 1;
const pending = new Map();          // rid -> resolve
let replyText = "", awaitingReply = false, replyDone = null;

function connect() {
  log("connecting " + WS_URL + " …");
  ws = new WebSocket(WS_URL);
  ws.onopen = () => log("WS connected");
  ws.onclose = (e) => log("WS closed (code " + e.code + ")");
  ws.onerror = () => log("WS ERROR — 若是 wss 证书问题,先在浏览器单独打开 " + location.origin + " 接受证书");
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.id && pending.has(msg.id)) {           // RPC response
      pending.get(msg.id)(msg);
      pending.delete(msg.id);
      return;
    }
    if (msg.method === "event") {                  // server event
      const { type, payload } = msg.params;
      if (type === "message.complete" && awaitingReply) {
        replyText = (payload && payload.text) || "";
        awaitingReply = false;
        if (replyDone) replyDone();
      }
    }
  };
}

function rpc(method, params) {
  return new Promise((resolve) => {
    const id = ridSeq++;
    pending.set(id, resolve);
    ws.send(JSON.stringify({ jsonrpc: "2.0", id, method, params }));
  });
}

async function ensureSession() {
  if (sessionId) return sessionId;
  const r = await rpc("session.create", { cols: 80 });
  sessionId = r.result.session_id;
  log("session: " + sessionId);
  return sessionId;
}

// ---- recording ----
let mediaRecorder, chunks = [], recMime = "audio/webm";
let recording = false;

async function startRec() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    log("ERROR: 此页面非安全上下文,浏览器不提供麦克风。确认地址是 https:// 或 localhost"); return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    log("麦克风获取失败: " + e.name + " — " + e.message); return;
  }
  const mime = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm"
             : MediaRecorder.isTypeSupported("audio/ogg") ? "audio/ogg" : "";
  if (!mime) { log("ERROR: 浏览器不支持 webm/ogg 录制"); stream.getTracks().forEach(t=>t.stop()); return; }
  recMime = mime;
  chunks = [];
  mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
  mediaRecorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  mediaRecorder.start();
  log("recording… (" + mime + ")");
}

function blobToBase64(blob) {
  return new Promise((res) => {
    const r = new FileReader();
    r.onloadend = () => res(r.result.split(",")[1]);  // strip data: prefix
    r.readAsDataURL(blob);
  });
}

// Stop the recorder and return the transcript (or "" if no speech).
async function stopAndTranscribe() {
  if (!mediaRecorder || mediaRecorder.state === "inactive") {
    log("(没有进行中的录音 — 麦克风可能未启动)"); return "";
  }
  const done = new Promise((res) => (mediaRecorder.onstop = res));
  mediaRecorder.stop();
  mediaRecorder.stream.getTracks().forEach((t) => t.stop());
  await done;

  const blob = new Blob(chunks, { type: recMime });
  log("captured " + blob.size + " bytes");
  if (!blob.size) { log("(录到 0 字节 — 按住时间太短或麦克风静音)"); return ""; }
  const audio = await blobToBase64(blob);
  log("transcribing…");
  const tr = await rpc("voice.transcribe", { audio, mime: recMime });
  if (tr.error) { log("STT error: " + tr.error.message); return ""; }
  return (tr.result && tr.result.text) || "";
}

// Synthesize text and play it; drives the "speaking" step.
async function speak(text) {
  log("synthesizing…");
  const syn = await rpc("voice.synthesize", { text });
  if (syn.error) { log("TTS error: " + syn.error.message); return; }
  const bytes = Uint8Array.from(atob(syn.result.audio), (c) => c.charCodeAt(0));
  log("got " + bytes.length + " bytes of audio (" + syn.result.mime + ")");
  const url = URL.createObjectURL(new Blob([bytes], { type: syn.result.mime }));
  const audio = new Audio(url);
  try {
    await audio.play();
    log("playing ▶ (听到声音了吗?没有就看下面的手动播放按钮 / 检查音量)");
  } catch (e) {
    // Autoplay blocked — surface a manual play button so the user can click.
    log("自动播放被浏览器拦截 (" + e.name + ") — 点下面的按钮播放 👇");
    const b = document.createElement("button");
    b.textContent = "▶ 播放回复";
    b.onclick = () => { audio.play(); };
    document.body.appendChild(b);
  }
}

// Echo mode: record → transcribe → speak the transcript back. No LLM needed —
// this validates the new voice.transcribe + voice.synthesize round-trip alone.
async function runEcho() {
  const text = await stopAndTranscribe();
  if (!text) { log("(no speech detected)"); return; }
  log("you: " + text);
  await speak(text);
}

// Full mode: record → transcribe → hermes agent turn → speak the reply.
// Requires a configured model + API key (prompt.submit calls the LLM).
async function runFull() {
  const text = await stopAndTranscribe();
  if (!text) { log("(no speech detected)"); return; }
  log("you: " + text);

  await ensureSession();
  replyText = ""; awaitingReply = true;
  const waitReply = new Promise((res) => (replyDone = res));
  await rpc("prompt.submit", { session_id: sessionId, text });
  log("thinking…");
  await waitReply;
  log("hermes: " + replyText);
  await speak(replyText);
}

function bind(id, runner) {
  const el = document.getElementById(id);
  el.addEventListener("mousedown", () => { startRec().catch((e) => log("startRec err: " + e)); });
  el.addEventListener("mouseup", () => { runner().catch((e) => log("run err: " + (e && e.message || e))); });
}
bind("echo", runEcho);
bind("rec", runFull);

connect();
</script>
</body>
</html>
