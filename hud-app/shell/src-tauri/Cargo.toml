[package]
name = "jarvis-hud-shell"
version = "0.0.1"
description = "Jarvis floating voice HUD — Tauri shell (M1 skeleton)"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "jarvis-hud"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
