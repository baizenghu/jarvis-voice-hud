<!doctype html>
<html lang="zh">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Jarvis Voice HUD</title>
  </head>

    <canvas id="hud"></canvas>

    <script type="module" src="/src/main.ts"></script>
